name: desktop-smoke-windows

"on":
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      label:
        type: string
        required: true
      desktopMode:
        type: string
        required: false
        default: pinned
      browserMode:
        type: string
        required: false
        default: pinned

permissions:
  contents: read

jobs:
  smoke:
    name: desktop / windows (${{ inputs.label }})
    runs-on: ${{ inputs.image }}
    timeout-minutes: 25
    env:
      DESKTOP_SMOKE_OS: ${{ inputs.label }}
      DESKTOP_SMOKE_DESKTOP_MODE: ${{ inputs.desktopMode }}
      DESKTOP_SMOKE_BROWSER_MODE: ${{ inputs.browserMode }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Load desktop smoke fixture
        shell: bash
        run: node scripts/desktop-smoke/fixture-env.mjs >> "$GITHUB_ENV"
      - name: Build local workbench (except docs)
        run: pnpm run build:libs
      - name: Install Desktop
        timeout-minutes: 10
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'dsh-desktop-${{ inputs.label }}.exe'
          if ($env:DESKTOP_SMOKE_DESKTOP_MODE -eq 'latest') {
            Invoke-WebRequest -Uri 'https://download.deepseek.com/desktop/dsh-latest-windows-x64.exe' -OutFile $installer
          } else {
            $url = $env:DESKTOP_SMOKE_DESKTOP_WIN_URL
            $expected = $env:DESKTOP_SMOKE_DESKTOP_WIN_ETAG
            $head = Invoke-WebRequest -Method Head -Uri $url
            $etag = ([string]$head.Headers.ETag).Trim('"')
            if ($etag -ne $expected) { throw "Desktop 版本漂了：fixture $expected，上游 $etag" }
            Invoke-WebRequest -Uri $url -OutFile $installer
          }
          $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer failed: $($install.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(120)
          $exe = $null
          while ($null -eq $exe -and (Get-Date) -lt $deadline) {
            $exe = Get-ChildItem -Path @("$env:LOCALAPPDATA\Programs", "$env:ProgramFiles", "${env:ProgramFiles(x86)}") -Filter 'DeepSeek Harness.exe' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $exe) { Start-Sleep -Seconds 2 }
          }
          if ($null -eq $exe) { throw 'DeepSeek Harness.exe not found' }
          "DESKTOP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Assert default user has no opencli
        shell: pwsh
        run: |
          if (Get-Command opencli -ErrorAction SilentlyContinue) { throw 'opencli is preinstalled; this smoke must start without it' }
          'opencli: missing (expected)'
      - name: Prepare opencli browser extension
        timeout-minutes: 10
        run: node scripts/desktop-smoke/prepare-browser.mjs
      - name: Open Desktop, install workbench and market module, restart once
        timeout-minutes: 15
        shell: pwsh
        env:
          DESKTOP_WORKBENCH_SPEC: ${{ github.workspace }}\packages\core
          DESKTOP_SMOKE_OUT: ${{ github.workspace }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app.log'
          $err = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app.err.log'
          $out2 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app2.log'
          $err2 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app2.err.log'
          $out3 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app3.log'
          $err3 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app3.err.log'
          $out4 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app4.log'
          $err4 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app4.err.log'
          $out5 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app5.log'
          $err5 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app5.err.log'
          $out6 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app6.log'
          $err6 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app6.err.log'
          $out7 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app7.log'
          $err7 = Join-Path $env:RUNNER_TEMP 'desktop-${{ inputs.label }}-app7.err.log'
          "DESKTOP_SMOKE_APP_LOG=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_SMOKE_APP_ERR=$err" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_SMOKE_APP_LOG_2=$out2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DESKTOP_SMOKE_APP_ERR_2=$err2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          function Stop-App {
            Get-Process | Where-Object { $_.ProcessName -like '*DeepSeek*' } | Stop-Process -Force -ErrorAction SilentlyContinue
            for ($i = 0; $i -lt 30; $i++) {
              $left = Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like '*DeepSeek*' }
              if ($null -eq $left) { return }
              Start-Sleep -Seconds 1
            }
          }
          function Start-App([int]$port, [string]$log, [string]$logErr) {
            Start-Process -FilePath $env:DESKTOP_EXE -ArgumentList "--remote-debugging-port=$port" -RedirectStandardOutput $log -RedirectStandardError $logErr -PassThru
          }
          function Invoke-Allowed([string]$label, [scriptblock]$what) {
            $log = Join-Path $env:RUNNER_TEMP "$label.log"
            & $what *> $log
            if ($LASTEXITCODE -eq 0) { $global:LASTEXITCODE = 0; return $true }
            Get-Content $log -Tail 20 | Write-Host
            $global:LASTEXITCODE = 0
            return $false
          }
          function Invoke-Logged([string]$label, [scriptblock]$what) {
            $log = Join-Path $env:RUNNER_TEMP "$label.log"
            & $what *> $log
            if ($LASTEXITCODE -ne 0) {
              Get-Content $log -Tail 30 | Write-Host
              $body = ((Get-Content $log -Tail 30) | Where-Object { $_ -ne '' } | ForEach-Object { ($_ -replace '%', '%25') + '%0A' }) -join ''
              Write-Host "::error title=$label failed::$body"
              throw "$label failed"
            }
          }
          function Invoke-Warned([string]$label, [scriptblock]$what) {
            $log = Join-Path $env:RUNNER_TEMP "$label.log"
            & $what *> $log
            if ($LASTEXITCODE -eq 0) { return $true }
            Get-Content $log -Tail 20 | Write-Host
            $body = ((Get-Content $log -Tail 20) | Where-Object { $_ -ne '' } | ForEach-Object { ($_ -replace '%', '%25') + '%0A' }) -join ''
            Write-Host "::warning title=$label (回退 E2E 试验中，不挡这条腿)::$body"
            $global:LASTEXITCODE = 0
            return $false
          }
          function Wait-Page([int]$port) {
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $json = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$port/json" -TimeoutSec 2
                if ($json.Content -match '"type": ?"page"') { return $true }
              } catch { }
              Start-Sleep -Seconds 1
            }
            return $false
          }
          Stop-App
          $app = Start-App 9222 $out $err
          "desktop pid: $($app.Id)"
          if (-not (Wait-Page 9222)) { throw 'first instance produced no page' }
          Invoke-Logged 'probe-install' { node scripts/desktop-smoke/cdp-probe.mjs 9222 desktop-${{ inputs.label }}.png --install-via-ui }
          Stop-App
          $app2 = Start-App 9223 $out2 $err2
          "restarted desktop pid: $($app2.Id)"
          if (-not (Wait-Page 9223)) {
            'restart produced no page; trying once more'
            Stop-App
            $app2 = Start-App 9223 $out2 $err2
            if (-not (Wait-Page 9223)) { throw 'restart still produced no page' }
          }
          Invoke-Logged 'probe-after-restart' { node scripts/desktop-smoke/cdp-probe.mjs 9223 desktop-${{ inputs.label }}-after-restart.png --verify-only --expect-workbench --expect-diy-default }
          Stop-App
          $app5 = Start-App 9226 $out5 $err5
          "add-plugin desktop pid: $($app5.Id)"
          if (-not (Wait-Page 9226)) { throw 'add-plugin instance produced no page' }
          Invoke-Logged 'add-plugin-probe' { node scripts/desktop-smoke/cdp-probe.mjs 9226 desktop-${{ inputs.label }}-add-plugin.png --add-plugin $env:DESKTOP_SMOKE_PLUGIN }
          $global:LASTEXITCODE = 0
          # 自更新这条 E2E 已经立住：三段都按硬判据走，红就挡这条腿。
          $appRoot = Join-Path $env:USERPROFILE '.dsh'
          Stop-App
          Invoke-Logged 'update-fixture' { node scripts/desktop-smoke/self-update-update-fixture.mjs $appRoot 'desktop' $env:DESKTOP_SMOKE_UPDATE_FROM }
          $app6 = Start-App 9227 $out6 $err6
          "self-update desktop pid: $($app6.Id)"
          if (!(Wait-Page 9227)) { throw 'update-probe: 起 9227 后没有页面' }
          Invoke-Logged 'update-probe' { node scripts/desktop-smoke/cdp-probe.mjs 9227 desktop-${{ inputs.label }}-self-update.png --self-update }
          $ready = Join-Path $env:DESKTOP_SMOKE_OUT "desktop-${{ inputs.label }}-self-update-ready.json"
          $to = ''
          if (Test-Path -LiteralPath $ready) {
            $to = (node -e "try{const p=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(typeof p.to==='string'?p.to:'')}catch{process.stdout.write('')}" $ready | Out-String).Trim()
          }
          if ($to -eq '') { throw "update-probe: 探针没写出 $ready，或里面没有 to" }
          $env:DESKTOP_SMOKE_EXPECT_RUNNING_VERSION = $to
          Stop-App
          $app7 = Start-App 9228 $out7 $err7
          "after-self-update desktop pid: $($app7.Id)"
          if (!(Wait-Page 9228)) { throw 'update-after-restart: 起 9228 后没有页面' }
          if (-not (Invoke-Allowed 'update-after-restart' { node scripts/desktop-smoke/cdp-probe.mjs 9228 desktop-${{ inputs.label }}-after-self-update.png --verify-only --expect-workbench --skip-module-card })) {
            Write-Host '第一次重启后体检没过：再启一次（换链后的头一跑偶发拿不到宿主路由）'
            Stop-App
            $app8 = Start-App 9228 $out7 $err7
            "after-self-update retry desktop pid: $($app8.Id)"
            if (-not (Wait-Page 9228)) { throw 'update-after-restart: 重试时起 9228 后没有页面' }
            Invoke-Logged 'update-after-restart-retry' { node scripts/desktop-smoke/cdp-probe.mjs 9228 desktop-${{ inputs.label }}-after-self-update-retry.png --verify-only --expect-workbench --skip-module-card }
          }
          $global:LASTEXITCODE = 0
      - name: Assert opencli installed
        timeout-minutes: 5
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:DESKTOP_SMOKE_OPENCLI)) { throw 'prepare-browser 没导出 DESKTOP_SMOKE_OPENCLI' }
          $bin = $env:DESKTOP_SMOKE_OPENCLI
          $deadline = (Get-Date).AddSeconds(180)
          while (!(Test-Path $bin)) {
            if ((Get-Date) -gt $deadline) { throw "opencli bin missing after 180s: $bin" }
            Start-Sleep -Seconds 5
          }
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "opencli --version failed: $LASTEXITCODE" }
      - name: Assert module installed
        timeout-minutes: 5
        shell: pwsh
        run: |
          $env:SMOKE_MANIFEST = "$env:USERPROFILE\.dsh\profiles\desktop\package.json"
          node -e "
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.SMOKE_MANIFEST, 'utf8'));
          const name = process.env.DESKTOP_SMOKE_MODULE;
          const spec = (manifest.dependencies ?? {})[name];
          const bundles = (manifest.dsh && manifest.dsh.profile && manifest.dsh.profile.bundles) || [];
          if (spec === undefined && !bundles.includes(name)) throw new Error(name + ' 没进 profile');
          console.log(name, spec ?? 'bundle');
          "
      - name: Assert opencli plugin installed
        timeout-minutes: 5
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:DESKTOP_SMOKE_PLUGIN)) { throw 'DESKTOP_SMOKE_PLUGIN is empty' }
          if ([string]::IsNullOrEmpty($env:DESKTOP_SMOKE_OPENCLI)) { throw 'prepare-browser 没导出 DESKTOP_SMOKE_OPENCLI' }
          $pluginId = (Get-Content "scripts/desktop-smoke/plugins/$env:DESKTOP_SMOKE_PLUGIN/opencli-plugin.json" -Raw | ConvertFrom-Json).name
          $raw = (& $env:DESKTOP_SMOKE_OPENCLI plugin list -f json 2>&1 | Out-String)
          Write-Host $raw
          if ($LASTEXITCODE -ne 0) {
            $body = ((($raw -split "`r?`n") | Where-Object { $_ -ne '' } | Select-Object -Last 30 | ForEach-Object { ($_ -replace '%', '%25') + '%0A' }) -join '')
            Write-Host "::error title=plugin list failed::$body"
            throw "opencli plugin list failed: $LASTEXITCODE"
          }
          $parsed = $raw | ConvertFrom-Json
          $rows = @()
          if ($parsed -is [array]) {
            $rows = $parsed
          } elseif ($null -ne $parsed -and $parsed.PSObject.Properties.Name -contains 'data') {
            $rows = @($parsed.data)
          } elseif ($null -ne $parsed) {
            $rows = @($parsed)
          }
          if (-not ($rows | Where-Object { $_.name -eq $pluginId })) {
            $body = ((($raw -split "`r?`n") | Where-Object { $_ -ne '' } | Select-Object -Last 30 | ForEach-Object { ($_ -replace '%', '%25') + '%0A' }) -join '')
            Write-Host "::error title=plugin not listed::$body"
            throw "plugin $pluginId not listed"
          }
          "plugin $pluginId @ present"
      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DESKTOP_SMOKE_STATUS: ${{ job.status }}
        run: node scripts/desktop-smoke/collect.mjs
      - name: Stop Desktop
        if: always()
        continue-on-error: true
        shell: pwsh
        run: Get-Process | Where-Object { $_.ProcessName -like '*DeepSeek*' } | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Collect logs
        if: failure() || cancelled()
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          {
            echo "== self-update.json"; cat "$USERPROFILE/.dsh/workbench/self-update.json" 2>/dev/null
            echo "== profile package.json"; cat "$USERPROFILE/.dsh/profiles/desktop/package.json" 2>/dev/null
            echo "== profile links"; ls -l "$USERPROFILE/.dsh/profiles/desktop/node_modules/@dsh-workbench" 2>/dev/null
            echo "== versions"; ls -1 "$USERPROFILE/.dsh/workbench/versions" 2>/dev/null
            for v in "$USERPROFILE"/.dsh/workbench/versions/*; do
              echo "== 版本目录 $v"
              ls -l "$v/node_modules/@dsh-workbench" 2>/dev/null
              echo "  .pnpm 条目数: $(ls -1 "$v/node_modules/.pnpm" 2>/dev/null | wc -l)"
              for pkg in "$v"/node_modules/@dsh-workbench/*; do
                name="$(basename "$pkg")"
                echo "  $name: pkg=$(test -f "$pkg/package.json" && echo yes || echo no) host=$(test -f "$pkg/dist/host/index.js" -o -f "$pkg/dist/host.js" && echo yes || echo no) client=$(test -f "$pkg/client.js" && echo yes || echo no) 内容=$(ls -1A "$pkg" 2>/dev/null | wc -l) 个"
              done
              echo "  目录时间: $(ls -ld "$v" | awk '{print $6, $7, $8}')"
            done
          } > "desktop-${{ inputs.label }}-self-update-state.txt" 2>&1 || true
          for log in "$RUNNER_TEMP"/desktop-${{ inputs.label }}*.log; do
            cp "$log" "./$(basename "$log")" 2>/dev/null || true
          done
          for log in "$RUNNER_TEMP"/*.log; do
            cp "$log" "./desktop-${{ inputs.label }}-runner-$(basename "$log")" 2>/dev/null || true
          done
          for log in "$USERPROFILE"/.dsh/*.log "$USERPROFILE"/.dsh/logs/*.log \
                     "$USERPROFILE"/.dsh/workbench/*.log "$USERPROFILE"/.dsh/workbench/logs/*.log \
                     "$APPDATA/DeepSeek Harness/logs"/*.log "$LOCALAPPDATA/DeepSeek Harness/logs"/*.log; do
            cp "$log" "./desktop-${{ inputs.label }}-dsh-$(basename "$log")" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: desktop-smoke-windows-${{ inputs.label }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            desktop-${{ inputs.label }}*.png
            desktop-${{ inputs.label }}*.txt
            desktop-${{ inputs.label }}*.json
            desktop-${{ inputs.label }}*.log

      - name: Summarize failure
        if: failure() || cancelled()
        shell: bash
        run: |
          {
            echo "## desktop smoke / windows (${{ inputs.label }})"
            for f in desktop-${{ inputs.label }}*.log; do
              if [ -f "$f" ]; then
                echo "### $f"
                tail -n 100 "$f"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
