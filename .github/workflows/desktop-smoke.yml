name: desktop-smoke

"on":
  workflow_dispatch:
    inputs:
      desktopMode:
        type: choice
        options: [pinned, latest]
        default: pinned
      browserMode:
        type: choice
        options: [pinned, latest]
        default: pinned
  workflow_call:
    inputs:
      desktopMode:
        type: string
        required: false
        default: pinned
      browserMode:
        type: string
        required: false
        default: pinned
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/desktop-smoke/**'
      - 'packages/core/bin/**'
      - 'packages/core/package.json'
      - 'packages/core/src/shared/api/host/**'
      - 'packages/core/src/modules/**'
      - '.github/workflows/desktop-smoke.yml'
      - '.github/workflows/desktop-smoke-windows.yml'
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: desktop-smoke-${{ github.ref }}-${{ inputs.desktopMode || 'pinned' }}-${{ inputs.browserMode || 'pinned' }}
  cancel-in-progress: true

jobs:
  windows-11:
    name: desktop / windows 11 (server 2025)
    uses: ./.github/workflows/desktop-smoke-windows.yml
    with:
      image: windows-2025
      label: win11
      desktopMode: ${{ inputs.desktopMode || 'pinned' }}
      browserMode: ${{ inputs.browserMode || 'pinned' }}

  windows-10:
    name: desktop / windows 10-class (server 2022)
    uses: ./.github/workflows/desktop-smoke-windows.yml
    with:
      image: windows-2022
      label: win10
      desktopMode: ${{ inputs.desktopMode || 'pinned' }}
      browserMode: ${{ inputs.browserMode || 'pinned' }}

  macos:
    name: desktop / macos arm64
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DESKTOP_SMOKE_OS: mac
      DESKTOP_SMOKE_DESKTOP_MODE: ${{ inputs.desktopMode || 'pinned' }}
      DESKTOP_SMOKE_BROWSER_MODE: ${{ inputs.browserMode || 'pinned' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Load desktop smoke fixture
        shell: bash
        run: node scripts/desktop-smoke/fixture-env.mjs >> "$GITHUB_ENV"
      - name: Build local workbench (except docs)
        run: pnpm run build:libs
      - name: Install Desktop
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "${DESKTOP_SMOKE_DESKTOP_MODE:-pinned}" = "latest" ]; then
            curl -fL --retry 2 -o "$RUNNER_TEMP/dsh-desktop-mac.dmg" "https://download.deepseek.com/desktop/dsh-latest-macos-arm64.dmg"
          else
            url="$DESKTOP_SMOKE_DESKTOP_MAC_URL"
            expected="$DESKTOP_SMOKE_DESKTOP_MAC_ETAG"
            etag=$(curl -sSI --retry 2 --max-time 30 "$url" | tr -d '\r' | awk -F': ' 'tolower($1)=="etag"{print $2; exit}' | tr -d '"')
            if [ "$etag" != "$expected" ]; then
              echo "::error title=Desktop 版本漂了::fixture $expected，上游 $etag"
              exit 1
            fi
            curl -fL --retry 2 -o "$RUNNER_TEMP/dsh-desktop-mac.dmg" "$url"
          fi
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dsh-mnt" "$RUNNER_TEMP/dsh-desktop-mac.dmg"
          cp -R "$RUNNER_TEMP/dsh-mnt/DeepSeek Harness.app" /Applications/
          hdiutil detach "$RUNNER_TEMP/dsh-mnt"
          xattr -dr com.apple.quarantine '/Applications/DeepSeek Harness.app'
      - name: Assert default user has no opencli
        shell: bash
        run: |
          if command -v opencli >/dev/null 2>&1; then echo "unexpected opencli: $(command -v opencli)"; exit 1; fi
          echo 'opencli: missing (expected)'
      - name: Prepare opencli browser extension
        timeout-minutes: 10
        run: node scripts/desktop-smoke/prepare-browser.mjs
      - name: Open Desktop, install workbench and market module, restart once
        timeout-minutes: 15
        shell: bash
        env:
          DESKTOP_WORKBENCH_SPEC: ${{ github.workspace }}/packages/core
          DESKTOP_SMOKE_OUT: ${{ github.workspace }}
        run: |
          {
            echo "DESKTOP_SMOKE_APP_LOG=$RUNNER_TEMP/desktop-mac-app.log"
            echo "DESKTOP_SMOKE_APP_ERR=$RUNNER_TEMP/desktop-mac-app.err.log"
          } >> "$GITHUB_ENV"
          APP_LOG="$RUNNER_TEMP/desktop-mac-app.log"
          APP_ERR="$RUNNER_TEMP/desktop-mac-app.err.log"
          BIN='/Applications/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness'
          stop_app() {
            pkill -f 'DeepSeek Harness' 2>/dev/null || true
            for _ in $(seq 1 30); do
              if ! pgrep -f 'DeepSeek Harness' >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            pkill -9 -f 'DeepSeek Harness' 2>/dev/null || true
            for _ in $(seq 1 5); do
              if ! pgrep -f 'DeepSeek Harness' >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
          }
          start_app() {
            ( cd / && exec "$BIN" --remote-debugging-port="$1" >> "$APP_LOG" 2>> "$APP_ERR" ) &
          }
          run_logged_allowed() {
            local label="$1"
            shift
            if "$@" > "$RUNNER_TEMP/$label.log" 2>&1; then return 0; fi
            tail -n 20 "$RUNNER_TEMP/$label.log"
            return 1
          }
          run_logged() {
            local label="$1"
            shift
            if ! "$@" > "$RUNNER_TEMP/$label.log" 2>&1; then
              cat "$RUNNER_TEMP/$label.log"
              body=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/$label.log" | tail -n 30 | awk 'NF { printf "%s%%0A", $0 }')
              echo "::error title=$label failed::${body:0:1400}"
              exit 1
            fi
          }
          try_logged() {
            local label="$1"
            shift
            if "$@" > "$RUNNER_TEMP/$label.log" 2>&1; then return 0; fi
            tail -n 20 "$RUNNER_TEMP/$label.log"
            body=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/$label.log" | tail -n 20 | awk 'NF { printf "%s%%0A", $0 }')
            echo "::warning title=$label（回退 E2E 试验中，不挡这条腿）::${body:0:1200}"
            return 1
          }
          wait_page() {
            for _ in $(seq 1 60); do
              if curl -fsS -m 2 "http://127.0.0.1:$1/json" 2>/dev/null | grep -Eq '"type": ?"page"'; then return 0; fi
              sleep 1
            done
            return 1
          }
          stop_app
          start_app 9222
          if ! wait_page 9222; then echo 'first instance produced no page'; exit 1; fi
          run_logged probe-install node "$GITHUB_WORKSPACE/scripts/desktop-smoke/cdp-probe.mjs" 9222 desktop-mac.png --install-via-ui
          stop_app
          start_app 9223
          if ! wait_page 9223; then
            echo 'restart produced no page; trying once more'
            stop_app
            start_app 9223
            wait_page 9223 || { echo 'restart still produced no page'; exit 1; }
          fi
          run_logged probe-after-restart node "$GITHUB_WORKSPACE/scripts/desktop-smoke/cdp-probe.mjs" 9223 desktop-mac-after-restart.png --verify-only --expect-workbench --expect-diy-default
          stop_app
          start_app 9226
          if ! wait_page 9226; then echo 'add-plugin instance produced no page'; exit 1; fi
          run_logged add-plugin-probe node "$GITHUB_WORKSPACE/scripts/desktop-smoke/cdp-probe.mjs" 9226 desktop-mac-add-plugin.png --add-plugin "$DESKTOP_SMOKE_PLUGIN"
          # 自更新这条 E2E 已经立住：三段都按硬判据走，红就挡这条腿。
          # 夹具要在 app 关着时把 profile 翻成"已迁移"的链接形态：先停掉上一个实例。
          stop_app
          run_logged update-fixture node "$GITHUB_WORKSPACE/scripts/desktop-smoke/self-update-update-fixture.mjs" "$HOME/.dsh" desktop "$DESKTOP_SMOKE_UPDATE_FROM"
          start_app 9227
          if ! wait_page 9227; then
            echo "::error title=update-probe::起 9227 后没有页面"
            exit 1
          fi
          run_logged update-probe node "$GITHUB_WORKSPACE/scripts/desktop-smoke/cdp-probe.mjs" 9227 desktop-mac-self-update.png --self-update
          ready="$DESKTOP_SMOKE_OUT/desktop-mac-self-update-ready.json"
          to=$(node -e "try{const p=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(typeof p.to==='string'?p.to:'')}catch{process.stdout.write('')}" "$ready" 2>/dev/null || true)
          if [ -z "$to" ]; then
            echo "::error title=update-probe::探针没写出 $ready，或里面没有 to"
            exit 1
          fi
          export DESKTOP_SMOKE_EXPECT_RUNNING_VERSION="$to"
          stop_app
          start_app 9228
          if ! wait_page 9228; then
            echo "::error title=update-after-restart::起 9228 后没有页面"
            exit 1
          fi
          if ! run_logged_allowed update-after-restart node "$GITHUB_WORKSPACE/scripts/desktop-smoke/cdp-probe.mjs" 9228 desktop-mac-after-self-update.png --verify-only --expect-workbench; then
            echo "第一次重启后体检没过：再启一次（换链后的头一跑在 Windows/mac 上偶发拿不到宿主路由）"
            stop_app
            start_app 9228
            if ! wait_page 9228; then
              echo "::error title=update-after-restart::重试时起 9228 后没有页面"
              exit 1
            fi
            run_logged update-after-restart-retry node "$GITHUB_WORKSPACE/scripts/desktop-smoke/cdp-probe.mjs" 9228 desktop-mac-after-self-update-retry.png --verify-only --expect-workbench
          fi
      - name: Assert opencli installed
        timeout-minutes: 5
        shell: bash
        run: |
          if [ -z "${DESKTOP_SMOKE_OPENCLI:-}" ]; then
            echo '::error title=opencli bin missing::prepare-browser 没导出 DESKTOP_SMOKE_OPENCLI'
            exit 1
          fi
          if [ ! -x "$DESKTOP_SMOKE_OPENCLI" ]; then
            echo "::error title=opencli bin missing::opencli bin 不在或不可执行：$DESKTOP_SMOKE_OPENCLI"
            exit 1
          fi
          "$DESKTOP_SMOKE_OPENCLI" --version
      - name: Assert module installed
        timeout-minutes: 5
        shell: bash
        run: |
          export SMOKE_MANIFEST="$HOME/.dsh/profiles/desktop/package.json"
          node -e "
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.SMOKE_MANIFEST, 'utf8'));
          const name = process.env.DESKTOP_SMOKE_MODULE;
          const spec = (manifest.dependencies ?? {})[name];
          const bundles = (manifest.dsh && manifest.dsh.profile && manifest.dsh.profile.bundles) || [];
          if (spec === undefined && !bundles.includes(name)) throw new Error(name + ' 没进 profile');
          console.log(name, spec ?? 'bundle');
          "
      - name: Assert opencli plugin installed
        timeout-minutes: 5
        shell: bash
        run: |
          if [ -z "${DESKTOP_SMOKE_PLUGIN:-}" ]; then
            echo '::error title=plugin spec missing::DESKTOP_SMOKE_PLUGIN is empty'
            exit 1
          fi
          if [ -z "${DESKTOP_SMOKE_OPENCLI:-}" ]; then
            echo '::error title=opencli bin missing::prepare-browser 没导出 DESKTOP_SMOKE_OPENCLI'
            exit 1
          fi
          plugin_id=$(node -p "require('./scripts/desktop-smoke/plugins/' + process.env.DESKTOP_SMOKE_PLUGIN + '/opencli-plugin.json').name")
          if ! list=$("$DESKTOP_SMOKE_OPENCLI" plugin list -f json 2>&1); then
            body=$(printf '%s\n' "$list" | sed -e 's/%/%25/g' | tail -n 30 | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=plugin list failed::${body:0:1400}"
            exit 1
          fi
          printf '%s\n' "$list"
          if ! printf '%s' "$list" | SMOKE_PLUGIN_ID="$plugin_id" node -e "
            let raw = '';
            process.stdin.on('data', (chunk) => (raw += chunk)).on('end', () => {
              const parsed = JSON.parse(raw);
              const rows = Array.isArray(parsed) ? parsed : (parsed.data ?? []);
              const hit = rows.some((one) => one && one.name === process.env.SMOKE_PLUGIN_ID);
              console.log(hit ? 'plugin ' + process.env.SMOKE_PLUGIN_ID + ' 在列表里' : 'plugin list 里没有 ' + process.env.SMOKE_PLUGIN_ID);
              process.exit(hit ? 0 : 1);
            });
          "; then
            body=$(printf '%s\n' "$list" | sed -e 's/%/%25/g' | tail -n 30 | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=plugin not listed::${body:0:1400}"
            exit 1
          fi
          echo "plugin $plugin_id @ present"
      - name: Collect diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DESKTOP_SMOKE_STATUS: ${{ job.status }}
        run: node scripts/desktop-smoke/collect.mjs
      - name: Stop Desktop
        if: always()
        continue-on-error: true
        shell: bash
        run: pkill -f 'DeepSeek Harness' 2>/dev/null || true
      - name: Collect logs
        if: failure() || cancelled()
        continue-on-error: true
        shell: bash
        run: |
          shopt -s nullglob
          {
            echo "== self-update.json"; cat "$HOME/.dsh/workbench/self-update.json" 2>/dev/null
            echo "== profile package.json"; cat "$HOME/.dsh/profiles/desktop/package.json" 2>/dev/null
            echo "== profile links"
            for pkg in "$HOME"/.dsh/profiles/desktop/node_modules/@dsh-workbench/*; do
              echo "$pkg -> $(readlink "$pkg" 2>/dev/null || echo '(真目录)')"
            done
            echo "== versions"; ls -1 "$HOME/.dsh/workbench/versions" 2>/dev/null
          } > "desktop-mac-self-update-state.txt" 2>&1 || true
          for log in "$RUNNER_TEMP"/desktop-mac*.log; do
            cp "$log" "./$(basename "$log")" 2>/dev/null || true
          done
          for log in "$RUNNER_TEMP"/*.log; do
            cp "$log" "./desktop-mac-runner-$(basename "$log")" 2>/dev/null || true
          done
          for log in "$HOME"/.dsh/*.log "$HOME"/.dsh/logs/*.log; do
            cp "$log" "./desktop-mac-dsh-$(basename "$log")" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: desktop-smoke-macos
          if-no-files-found: warn
          retention-days: 14
          path: |
            desktop-mac*.png
            desktop-mac*.txt
            desktop-mac*.json
            desktop-mac*.log
      - name: Summarize failure
        if: failure() || cancelled()
        shell: bash
        run: |
          {
            echo "## desktop smoke / macos"
            for f in desktop-mac*.log; do
              if [ -f "$f" ]; then
                echo "### $f"
                tail -n 100 "$f"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
