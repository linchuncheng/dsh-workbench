name: gate

"on":
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * 1'

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: full gate / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: mac
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Full gate (整条链，与本地 `pnpm run check` 同一条)
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm -w run check > gate.log 2>&1; then
            tail -n 80 gate.log
            body=$(grep -aE '✖|❌|error TS|FAIL|Failed|失败|ELIFECYCLE' gate.log | tail -n 20 | sed -e 's/%/%25/g' | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=gate failed::${body:0:1800}"
            exit 1
          fi
          tail -n 3 gate.log
      - name: 判据要在全新机器上也绿（dsh 现场指到空目录再跑一遍 selfcheck）
        shell: bash
        run: |
          set -o pipefail
          if ! DSH_HOME="$(mktemp -d)" pnpm -w run selfcheck > selfcheck.log 2>&1; then
            grep -aA 25 '❌' selfcheck.log || true
            tail -n 40 selfcheck.log
            body=$(grep -aE '❌|通过 —— 失败' selfcheck.log | head -n 12 | sed -e 's/%/%25/g' | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=fresh-home selfcheck failed::${body:0:1800}"
            exit 1
          fi
          tail -n 3 selfcheck.log
      - name: Upload gate logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.label }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            gate.log
            selfcheck.log
      - name: Summarize failure
        if: failure() || cancelled()
        shell: bash
        run: |
          {
            echo "## gate / ${{ matrix.label }}"
            for f in gate.log selfcheck.log; do
              if [ -f "$f" ]; then
                echo "### $f"
                tail -n 100 "$f"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
