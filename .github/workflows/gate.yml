name: gate

"on":
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * 1'

permissions:
  contents: write

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: full gate / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: mac
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Full gate (整条链，与本地 `pnpm run check` 同一条)
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm -w run check > gate.log 2>&1; then
            tail -n 80 gate.log
            body=$(grep -aE '✖|❌|error TS|FAIL|Failed|失败|ELIFECYCLE' gate.log | tail -n 20 | sed -e 's/%/%25/g' | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=gate failed::${body:0:1800}"
            exit 1
          fi
          tail -n 3 gate.log
      - name: 判据要在全新机器上也绿（dsh 现场指到空目录再跑一遍 selfcheck）
        shell: bash
        run: |
          set -o pipefail
          if ! DSH_HOME="$(mktemp -d)" pnpm -w run selfcheck > selfcheck.log 2>&1; then
            grep -aA 25 '❌' selfcheck.log || true
            tail -n 40 selfcheck.log
            body=$(grep -aE '❌|通过 —— 失败' selfcheck.log | head -n 12 | sed -e 's/%/%25/g' | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=fresh-home selfcheck failed::${body:0:1800}"
            exit 1
          fi
          tail -n 3 selfcheck.log
      - name: Publish gate log (失败时推到分支，public 仓读不到 job 日志)
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@example.com
          shopt -s nullglob
          files=(*.log)
          if [ ${#files[@]} -eq 0 ]; then echo "没有日志可推"; exit 0; fi
          git add -f "${files[@]}"
          git commit -m "ci: gate log [skip ci]" || true
          git push origin HEAD:gate-log-${{ matrix.label }}-${{ github.run_id }}
