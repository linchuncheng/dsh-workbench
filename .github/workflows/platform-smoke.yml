name: platform-smoke

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: &paths-ignore
      - '**.md'
      - 'packages/docs/**'
      - '.agents/**'
      - 'assets/**'
  pull_request:
    paths-ignore: *paths-ignore
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: write

concurrency:
  group: platform-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: mac
          - os: windows-latest
            label: win-2025
          - os: windows-2022
            label: win-2022
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build (except docs)
        shell: bash
        run: pnpm run build:libs
      - name: Assert pwsh (win32 引号往返要靠它)
        if: runner.os != 'Windows'
        shell: bash
        run: command -v pwsh
      - name: Front app deps（Xvfb + openbox + xterm + xdotool）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb openbox xterm xdotool
      - name: Smoke（Linux：无头 X + 目录发现）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          Xvfb :99 -screen 0 1024x768x24 >/dev/null 2>&1 &
          sleep 2
          export DISPLAY=:99
          openbox >/dev/null 2>&1 &
          sleep 2
          node scripts/smoke/index.mjs
      - name: Smoke（目录发现）
        if: runner.os != 'Linux'
        shell: bash
        run: node scripts/smoke/index.mjs
      - name: 平台敏感单测（platform-ci.json 驱动，每个平台分支在本腿真跑）
        shell: bash
        run: node scripts/ci/platform-tests.mjs
      - name: Selfcheck (core)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm --filter @dsh-workbench/core run selfcheck > selfcheck.log 2>&1; then
            tail -n 25 selfcheck.log
            body=$(grep -aE '❌|通过 —— 失败' selfcheck.log || tail -n 8 selfcheck.log)
            body=$(printf '%s\n' "$body" | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=selfcheck failed::${body:0:1800}"
            exit 1
          fi
          tail -n 3 selfcheck.log

      - name: Selfcheck (core, Windows 执行层判据)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          set -o pipefail
          if ! node packages/core/scripts/selfcheck/index.mjs --tag win32 > selfcheck.log 2>&1; then
            tail -n 25 selfcheck.log
            body=$(grep -aE '❌|通过 —— 失败' selfcheck.log || tail -n 8 selfcheck.log)
            body=$(printf '%s\n' "$body" | sed -e 's/%/%25/g' -e 's/\r$//' | awk 'NF { printf "%s%%0A", $0 }')
            echo "::error title=selfcheck (exec layer) failed::${body:0:1800}"
            exit 1
          fi
          tail -n 3 selfcheck.log

      - name: Publish smoke logs (失败时推到分支，public 仓读不到 job 日志)
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          git config user.name ci
          git config user.email ci@example.com
          shopt -s nullglob
          files=(*.log)
          if [ ${#files[@]} -eq 0 ]; then echo "没有日志可推"; exit 0; fi
          git add -f "${files[@]}"
          git commit -m "ci: platform smoke log [skip ci]" || true
          git push origin HEAD:smoke-log-${{ matrix.label }}-${{ github.run_id }}
